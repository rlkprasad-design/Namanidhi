<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nama Nidhi — Content Admin</title>
<meta name="robots" content="noindex, nofollow" />
<!-- Same policy as index.html - this page talks to the same Supabase
     project and nothing else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://esm.sh https://*.supabase.co; object-src 'none'; base-uri 'self';" />
<link rel="stylesheet" href="css/styles.css" />
<style>
  /* Admin-only additions - not part of the player-facing theme, so kept
     here rather than in css/styles.css. */
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .admin-wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  .admin-gate { max-width: 360px; margin: 15vh auto 0; text-align: center; }
  .admin-gate input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--gold);
    background: rgba(255,255,255,0.06); color: var(--cream); font-size: 1rem; margin: 12px 0;
  }
  .admin-gate p.error { color: var(--wrong); font-size: 0.9rem; min-height: 1.2em; }
  .admin-section { margin: 32px 0; }
  .admin-section h2 { font-family: inherit; }
  .row-edit input {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(240,210,139,0.35);
    background: rgba(255,255,255,0.05); color: var(--cream); font-size: 0.9rem;
  }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .row-actions button { font-size: 0.82rem; padding: 6px 10px; min-height: auto; }
  .lang-chip {
    display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px;
    border-radius: 999px; background: rgba(240,210,139,0.18); color: var(--gold-light);
  }
  .status-msg { font-size: 0.85rem; color: var(--gold-light); opacity: 0.85; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="admin-app" class="admin-wrap"></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
